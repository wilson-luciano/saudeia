<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" fill="#ffffff"/><rect x="12" y="12" width="1076" height="536" rx="24" fill="#f8fbff" stroke="#b9cde5" stroke-width="3"/><text x="550" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#173a7a">Por que separar treino e teste?</text><rect x="350" y="105" width="400" height="90" rx="18" fill="#eaf2ff" stroke="#4b83d6" stroke-width="3"/><text x="550.0" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#183153">100 registros tratados</text><text x="550.0" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334a63"></text><path d="M550,195 L550,245" fill="none" stroke="#2b6ac6" stroke-width="5"/><path d="M538,236 L550,245 L538,254" fill="none" stroke="#2b6ac6" stroke-width="5"/><rect x="80" y="260" width="440" height="135" rx="18" fill="#e8f5ff" stroke="#2680c9" stroke-width="3"/><text x="300.0" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#183153">70 registros (70%)</text><text x="300.0" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334a63">TREINO: aprende padrões</text><rect x="580" y="260" width="440" height="135" rx="18" fill="#fff0df" stroke="#ed8c2e" stroke-width="3"/><text x="800.0" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#183153">30 registros (30%)</text><text x="800.0" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334a63">TESTE: mede desempenho</text><text x="85" y="448" font-family="Arial,sans-serif" font-size="23" fill="#233c60">O teste deve conter exemplos não usados no ajuste.</text><text x="85" y="487" font-family="Arial,sans-serif" font-size="22" fill="#233c60">70/30 é uma opção: a proporção depende do conjunto de dados.</text></svg>