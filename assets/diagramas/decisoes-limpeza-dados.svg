<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
<rect width="1200" height="460" fill="#f8fbff"/><text x="600" y="49" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#10275c">Como o código transforma dados brutos em dados confiáveis</text>
<text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="17" fill="#4b5e79">Cada função resolve um problema específico antes do treinamento</text>
<rect x="40" y="115" width="360" height="128" rx="17" fill="#dbeafe" stroke="#9bb1c9"/><text x="220" y="150" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#10275c">Path</text><text x="220" y="186" text-anchor="middle" font-family="Arial" font-size="19" fill="#1d3557">Localiza arquivos</text><text x="220" y="214" text-anchor="middle" font-family="Arial" font-size="16" fill="#34455f">sem depender do terminal</text><rect x="430" y="115" width="360" height="128" rx="17" fill="#e0e7ff" stroke="#9bb1c9"/><text x="610" y="150" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#10275c">.copy()</text><text x="610" y="186" text-anchor="middle" font-family="Arial" font-size="19" fill="#1d3557">Protege os dados</text><text x="610" y="214" text-anchor="middle" font-family="Arial" font-size="16" fill="#34455f">cria tabela independente</text><rect x="820" y="115" width="360" height="128" rx="17" fill="#d1fae5" stroke="#9bb1c9"/><text x="1000" y="150" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#10275c">dropna()</text><text x="1000" y="186" text-anchor="middle" font-family="Arial" font-size="19" fill="#1d3557">Trata ausentes</text><text x="1000" y="214" text-anchor="middle" font-family="Arial" font-size="16" fill="#34455f">remove linhas incompletas</text><rect x="40" y="270" width="360" height="128" rx="17" fill="#fef3c7" stroke="#9bb1c9"/><text x="220" y="305" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#10275c">map()</text><text x="220" y="341" text-anchor="middle" font-family="Arial" font-size="19" fill="#1d3557">Padroniza textos</text><text x="220" y="369" text-anchor="middle" font-family="Arial" font-size="16" fill="#34455f">uniformiza sintomas e classes</text><rect x="430" y="270" width="360" height="128" rx="17" fill="#ffe4e6" stroke="#9bb1c9"/><text x="610" y="305" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#10275c">groupby() + nunique()</text><text x="610" y="341" text-anchor="middle" font-family="Arial" font-size="19" fill="#1d3557">Detecta conflitos</text><text x="610" y="369" text-anchor="middle" font-family="Arial" font-size="16" fill="#34455f">mesmo texto, classes diferentes</text><rect x="820" y="270" width="360" height="128" rx="17" fill="#d5f5f6" stroke="#9bb1c9"/><text x="1000" y="305" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#10275c">drop_duplicates()</text><text x="1000" y="341" text-anchor="middle" font-family="Arial" font-size="19" fill="#1d3557">Remove repetições</text><text x="1000" y="369" text-anchor="middle" font-family="Arial" font-size="16" fill="#34455f">após a padronização</text><text x="600" y="440" text-anchor="middle" font-family="Arial" font-size="16" fill="#50617c">Se houver rótulos conflitantes, interromper e revisar os dados antes de continuar.</text></svg>