<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805"><style>.title{font:700 38px Arial,sans-serif;fill:#0f172a}.sub{font:22px Arial,sans-serif;fill:#475569}.head{font:700 28px Arial,sans-serif;fill:#0f172a}.detail{font:22px Arial,sans-serif;fill:#334155}</style><rect x="6" y="6" width="1108" height="793" rx="26" fill="white" stroke="#64748b" stroke-width="3"/><text x="560" y="63" text-anchor="middle" class="title">Como interpretar a avaliação</text><text x="560" y="102" text-anchor="middle" class="sub">Acurácia não é sinônimo de confiabilidade</text><rect x="72" y="145" width="976" height="98" rx="18" fill="#dbeafe" stroke="#a7b4c5" stroke-width="2"/><text x="103" y="179" class="head">Acurácia</text><text x="103" y="212" class="detail">Fração total de previsões corretas</text><path d="M560 244 v20" stroke="#2563eb" stroke-width="4"/><rect x="72" y="265" width="976" height="98" rx="18" fill="#dcfce7" stroke="#a7b4c5" stroke-width="2"/><text x="103" y="299" class="head">Precisão por classe</text><text x="103" y="332" class="detail">Entre as previsões da classe, quantas acertaram?</text><path d="M560 364 v20" stroke="#2563eb" stroke-width="4"/><rect x="72" y="385" width="976" height="98" rx="18" fill="#fef3c7" stroke="#a7b4c5" stroke-width="2"/><text x="103" y="419" class="head">Revocação por classe</text><text x="103" y="452" class="detail">Entre os exemplos reais da classe, quantos detectou?</text><path d="M560 484 v20" stroke="#2563eb" stroke-width="4"/><rect x="72" y="505" width="976" height="98" rx="18" fill="#f3e8ff" stroke="#a7b4c5" stroke-width="2"/><text x="103" y="539" class="head">Matriz de confusão</text><text x="103" y="572" class="detail">Mostra onde as classes foram confundidas</text><path d="M560 604 v20" stroke="#2563eb" stroke-width="4"/><rect x="72" y="625" width="976" height="98" rx="18" fill="#fee2e2" stroke="#a7b4c5" stroke-width="2"/><text x="103" y="659" class="head">Limitação importante</text><text x="103" y="692" class="detail">Base pequena e didática: resultados variam e não são clínicos</text></svg>